- extensions:
  - default: false
  - name:
    - ApplicativeDo
    - FlexibleContexts
    - GADTs
    - RankNTypes
    - ScopedTypeVariables

# Prefer `f . g $ h x` over `f $ g $ h x`.
- group: {name: dollar, enabled: true}

# Prefer `pure` over `return`.
- group: {name: future, enabled: true}

# Prefer `fmap` over `map`, `(<>)` over `(++)`, and so on.
- group: {name: generalise, enabled: true}

# Generally prefer named functions over operators.
- ignore: {name: "Use <$>"}

# Prefer `elem x xs` over ``x `elem` xs``.
- ignore: {name: "Use infix"}

# Prefer `\x -> elem x xs` over ``(`elem` xs)``.
- ignore: {name: "Avoid lambda using `infix`"}

# Avoid `[x | p]` trick.
- ignore: {name: "Use list comprehension"}

# Avoid `LambdaCase` extension.
- ignore: {name: "Use lambda-case"}

# Avoid `TupleSections` extension.
- ignore: {name: "Use tuple-section"}

# A traversal whose job is to be revisited when a payload gains a field cannot
# write `{}`, which is what this hint asks for.
- ignore: {name: "Use record patterns", within: [Pawl.Engine.Resolve.Slots.objectRefQuantities, Pawl.Engine.Resolve.Slots.objectRefPlayerRefs]}

# Prefer using monomorphic, total conversion functions.
- functions:
  - name: fromIntegral
    within: []
    message: "Use Pawl.Extra.Int, Pawl.Extra.Integer, or Pawl.Extra.Natural."
  - name: fromInteger
    within: []
    message: "Use Pawl.Extra.Integer."
  - name: realToFrac
    within: []
    message: "Use Pawl.Extra, adding the conversion there if it is missing."
  - name: toEnum
    within: []
    message: "Use a named total conversion, such as Data.Char.chr."

# Prefer `case`, but `fromMaybe` is sometimes clearer; the choice is the
# author's.
- ignore: {name: "Replace case with fromMaybe"}

# Avoid partial functions. Allowed in tests, where blowing up at runtime is
# the same as failing.
- functions:
  - name:
    - Data.List.head
    - Data.List.tail
    - Data.List.!!
    - Data.Maybe.fromJust
    - Prelude.head
    - Prelude.tail
    - error
    - errorWithoutStackTrace
    - undefined
    within: ["**.*Spec", Pawl.Support]
    message: "Return Maybe or Either instead."
  - name: [read, reads]
    within: ["**.*Spec", Pawl.Support]
    message: "Use a total parser, such as Text.Read.readMaybe."
  - name: Data.Text.Encoding.decodeUtf8
    within: []
    message: "Use Data.Text.Encoding.decodeUtf8' instead."

# Avoid throwing from pure code.
- functions:
  - name: Control.Exception.throw
    within: []
    message: "Return Either, or use throwIO in IO."

# Avoid the lazy left fold, which builds a thunk chain.
- functions:
  - name: [Data.Foldable.foldl, Data.List.foldl]
    within: []
    message: "Use Data.Foldable.foldl' instead."

# Avoid unsafe and debugging-only modules.
- modules:
  - name: [Debug.Trace, System.IO.Unsafe, Unsafe.Coerce, Control.Concurrent]
    within: []
