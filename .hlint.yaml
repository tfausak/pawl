- extensions:
  - default: false
  - name:
    - ApplicativeDo
    - FlexibleContexts
    - GADTs
    - MultilineStrings
    - RankNTypes
    - ScopedTypeVariables

# Prefer `f . g $ h x` over `f $ g $ h x`.
- group: {name: dollar, enabled: true}

# Prefer `pure` over `return`.
- group: {name: future, enabled: true}

# Prefer `fmap` over `map`, `(<>)` over `(++)`, and so on.
- group: {name: generalise, enabled: true}

# Generally prefer named functions over operators.
- ignore: {name: "Use <$>"}

# Prefer `elem x xs` over ``x `elem` xs``.
- ignore: {name: "Use infix"}

# Prefer `\x -> elem x xs` over ``(`elem` xs)``.
- ignore: {name: "Avoid lambda using `infix`"}

# Avoid `[x | p]` trick.
- ignore: {name: "Use list comprehension"}

# Avoid `LambdaCase` extension.
- ignore: {name: "Use lambda-case"}

# Avoid `TupleSections` extension.
- ignore: {name: "Use tuple-section"}

# Prefer using monomorphic, total conversion functions.
- functions:
  - name: fromIntegral
    within: []
    message: "Use Pawl.Extra.Int, Pawl.Extra.Integer, or Pawl.Extra.Natural."
  - name: fromInteger
    within: []
    message: "Use Pawl.Extra.Integer."
  - name: realToFrac
    within: []
    message: "Use Pawl.Extra, adding the conversion there if it is missing."
  - name: toEnum
    within: []
    message: "Use a named total conversion, such as Data.Char.chr."
