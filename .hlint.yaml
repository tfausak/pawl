- extensions:
  - default: false
  - name:
    - ApplicativeDo
    # Pawl.JsonCodec.Fields is contravariant in its encoding direction, so it
    # can be Applicative but never Monad. ApplicativeDo is what lets a record
    # still be built with the do-notation the style guide asks for.
    - FlexibleContexts
    - GADTs
    - MultilineStrings
    - RankNTypes
    - ScopedTypeVariables
    # Pawl.JsonCodec.Fields and Pawl.JsonCodec.Arm derive a schema definition
    # name from their own type variable, which has to be in scope in the body.

# Prefer `f . g $ h x` over `f $ g $ h x`.
- group: {name: dollar, enabled: true}

# Prefer `pure` over `return`.
- group: {name: future, enabled: true}

# Prefer `fmap` over `map`, `(<>)` over `(++)`, and so on.
- group: {name: generalise, enabled: true}

# Generally prefer named functions over operators.
- ignore: {name: "Use <$>"}

# HLint wants prefix `elem x xs` rewritten to infix ``x `elem` xs``. The
# project style rule is the opposite: prefer functions to operators, and no
# backtick-infixed functions.
- ignore: {name: "Use infix"}

# Same rule, different hint name: this one rewrites `\x -> elem x xs` into a
# backticked section rather than a bare application.
- ignore: {name: "Avoid lambda using `infix`"}

# HLint wants `\gs -> f x (g gs)` eta-reduced to `f x . g`. The project style
# rule is the opposite: prefer explicit over point-free.
- ignore: {name: "Avoid lambda"}

# HLint rewrites `if c then [] else [x]` into `[x | not c]`. The project style
# rule bans list comprehensions outright, so this can never be applied.
- ignore: {name: "Use list comprehension"}

# HLint suggests `(, x)` for `\y -> (y, x)`. That needs TupleSections, and the
# project is Haskell 2010 with only GADTs and RankNTypes permitted, so the
# suggestion can never be applied.
- ignore: {name: "Use tuple-section"}

# Every one of these silently produces a wrong answer rather than failing:
# fromIntegral wraps a too-large Natural into a negative Int, fromInteger
# crashes outright on a negative Integer bound for a Natural, and toEnum crashes
# off the end of an enumeration. Pawl.Extra.Int, Pawl.Extra.Integer and
# Pawl.Extra.Natural hold the total replacements, each named for the type it
# converts out of and each saying in its own name what happens at the boundary.
- functions:
  - name: fromIntegral
    within: []
    message: "Use Pawl.Extra.Int, Pawl.Extra.Integer, or Pawl.Extra.Natural."
  - name: fromInteger
    within: []
    message: "Use Pawl.Extra.Integer."
  - name: realToFrac
    within: []
    message: "Use Pawl.Extra, adding the conversion there if it is missing."
  - name: toEnum
    within: []
    message: "Use a named total conversion, such as Data.Char.chr."
