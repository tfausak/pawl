# HLint wants prefix `elem x xs` rewritten to infix ``x `elem` xs``. The project
# style rule is the opposite: prefer functions to operators, and no
# backtick-infixed functions. See the style section of CONTRIBUTING.md.
- ignore: {name: "Use infix"}

# Same rule, different hint name: this one rewrites `\x -> elem x xs` into a
# backticked section rather than a bare application.
- ignore: {name: "Avoid lambda using `infix`"}

# HLint rewrites `if c then [] else [x]` into `[x | not c]`. The project style
# rule bans list comprehensions outright, so this can never be applied. See the
# style section of CONTRIBUTING.md.
- ignore: {name: "Use list comprehension"}

# HLint suggests `(, x)` for `\y -> (y, x)`. That needs TupleSections, and the
# project is Haskell 2010 with only GADTs and RankNTypes permitted, so the
# suggestion can never be applied. See the style section of CONTRIBUTING.md.
- ignore: {name: "Use tuple-section"}

# HLint rewrites a two-branch Nothing/Just case into the `maybe` combinator.
# The project style rule is the opposite: prefer case over clever combinators
# (freezeQuantities in Pawl.Projection is the first to trip this one). See the
# style section of CONTRIBUTING.md.
- ignore: {name: "Replace case with maybe"}
