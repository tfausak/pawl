name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build:
    name: Build ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    needs: meta
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            bench: true
            test: true
    steps:
      - uses: actions/checkout@v7
      - id: haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.14.1
      - id: info
        run: |
          echo "os=$(ghc -e 'putStrLn System.Info.os')" >> "$GITHUB_OUTPUT"
          echo "arch=$(ghc -e 'putStrLn System.Info.arch')" >> "$GITHUB_OUTPUT"
        shell: bash
      - run: mkdir artifact
      - run: ghc-pkg list
      - run: cabal sdist --output-dir artifact
      - run: cabal configure ${{ matrix.bench && '--enable-benchmarks' || '' }} ${{ matrix.test && '--enable-tests' || '' }} --flags=pedantic --jobs --semaphore
      - run: cat cabal.project.local
      - run: cp cabal.project.local artifact
      - run: cabal freeze
      - run: cat cabal.project.freeze
      - run: cp cabal.project.freeze artifact
      - run: cabal outdated --v2-freeze-file
      - uses: actions/cache@v6
        with:
          key: ${{ steps.info.outputs.os }}-${{ steps.info.outputs.arch }}-${{ hashFiles('cabal.project.freeze') }}
          path: ${{ steps.haskell.outputs.cabal-store }}
          restore-keys: ${{ steps.info.outputs.os }}-${{ steps.info.outputs.arch }}-
      - run: cabal build --only-download
      - run: cabal build --only-dependencies
      - run: cabal build
      - run: cp $( cabal list-bin ${{ needs.meta.outputs.name }} ) artifact
      - if: matrix.test
        run: cp $( cabal list-bin ${{ needs.meta.outputs.name }}-test-suite ) artifact
      - if: matrix.bench
        run: cp $( cabal list-bin ${{ needs.meta.outputs.name }}-benchmark ) artifact
      - run: tar --create --file artifact.tar --verbose artifact
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.meta.outputs.name }}-${{ github.sha }}-${{ steps.info.outputs.os }}-${{ steps.info.outputs.arch }}
          path: artifact.tar
  # The lint jobs below are flake checks. None of them caches the Nix store:
  # each pulls a prebuilt tool from cache.nixos.org and runs it, so there is
  # nothing worth carrying between runs.
  cabal:
    name: Cabal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.cabal
  gild:
    name: Gild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.gild
  hlint:
    name: HLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.hlint
  meta:
    name: Meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: name
        run: "echo name=$( awk '/^name:/ {print $2}' *.cabal ) >> $GITHUB_OUTPUT"
      - id: version
        run: "echo version=$( awk '/^version:/ {print $2}' *.cabal ) >> $GITHUB_OUTPUT"
    outputs:
      name: ${{ steps.name.outputs.name }}
      version: ${{ steps.version.outputs.version }}
  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Not cachix/install-nix-action: that installs the multi-user daemon,
      # which leaves /nix root-owned, and the cache restore then cannot untar
      # into it. This is the single-user install cache-nix-action expects.
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          # Flakes are on by default for nix > 2.13, so only max-jobs is worth
          # setting: it is what lets the dependency closure build concurrently.
          nix_conf: max-jobs = auto
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'pawl.cabal') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Builds the library, executable and benchmark, and runs the test suite
      # in the derivation's check phase.
      - run: nix build
      # A separate derivation, so the timing run is not cached with the build.
      - run: nix build --print-build-logs --out-link benchmark .#benchmark
      - run: cp benchmark/bench.csv .
      - uses: actions/upload-artifact@v7
        with:
          name: pawl-${{ github.sha }}-bench
          path: bench.csv
  ormolu:
    name: Ormolu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.ormolu
