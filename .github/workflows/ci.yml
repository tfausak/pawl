name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: max-jobs = auto
      # Keyed on the inputs alone. pawl itself is never in the cache (nix
      # rebuilds the package every run); only its dependencies are, and those
      # follow flake.lock. Keying on pawl.cabal too made nearly every PR miss,
      # since `-- cabal-gild: discover` rewrites it whenever a module is added,
      # and each miss re-saved the store for three to four minutes.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-
      - run: nix build
      - run: nix build --print-build-logs --out-link benchmark .#benchmark
      - run: cp benchmark/bench.csv .
      - uses: actions/upload-artifact@v7
        with:
          name: pawl-${{ github.sha }}-bench
          path: bench.csv
  cabal:
    name: Cabal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.cabal
  gild:
    name: Gild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.gild
  hlint:
    name: HLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.hlint
  nixfmt:
    name: Nixfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.nixfmt
  ormolu:
    name: Ormolu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.ormolu
  tracker:
    # The two checks that read GitHub itself, which is why they live here rather
    # than in `.hooky.kdl`: a census lives in an issue body and an issue's state
    # lives on GitHub, where `hooky fix` is offline and fast. Not a nix check
    # either -- a nix build sandbox has no network.
    name: Tracker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - run: script/check-census.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: script/check-gaps.sh
        env:
          GH_TOKEN: ${{ github.token }}
