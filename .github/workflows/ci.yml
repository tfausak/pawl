name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: cabal-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-keys: cabal-${{ hashFiles('flake.lock') }}-
      - run: nix develop .#ci --command cabal update
      - run: |
          nix develop .#ci --command cabal configure \
            --disable-executable-dynamic \
            --disable-shared \
            --flags=pedantic \
            --ghc-options='+RTS -A64m -RTS' \
            --jobs \
            --semaphore
      - run: nix develop .#ci --command cabal build all
      - run: nix develop .#ci --command cabal run pawl -- test --timeout=120s
  cabal:
    name: Cabal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.cabal
  gild:
    name: Gild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.gild
  hlint:
    name: HLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.hlint
  nixfmt:
    name: Nixfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.nixfmt
  ormolu:
    name: Ormolu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.ormolu
