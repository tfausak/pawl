name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      # A pull request can only restore what its base branch saved, so the push
      # trigger is what keeps that base warm; without it every branch would
      # start cold. Branches save too, so a second push reuses the first one's
      # objects, and since every restore refreshes main's entry, LRU keeps the
      # base alive. The key carries the commit so each run saves, and the lock
      # file leads the prefix because a compiler change invalidates every
      # object.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: cabal-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-keys: cabal-${{ hashFiles('flake.lock') }}-
      - run: nix develop .#ci --command cabal update
      # These reproduce cabal.project.local, which is gitignored. `--semaphore`
      # is deliberately absent: it earns nothing on a runner that runs one
      # cabal at a time, and a killed run corrupts it.
      - run: |
          nix develop .#ci --command cabal configure \
            --disable-executable-dynamic \
            --disable-shared \
            --enable-benchmarks \
            --enable-tests \
            --flags=pedantic \
            --ghc-options='+RTS -A64m -RTS' \
            --jobs=4
      - run: nix develop .#ci --command cabal build all
      - run: |
          nix develop .#ci --command cabal test \
            --test-options='--hide-successes --timeout 15s'
  cabal:
    name: Cabal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.cabal
  gild:
    name: Gild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.gild
  hlint:
    name: HLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.hlint
  nixfmt:
    name: Nixfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.nixfmt
  ormolu:
    name: Ormolu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.ormolu
